  <text x="624.0" y="214.0" font-size="22" fill="#9BBACB" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" opacity="1">
    <animate attributeName="opacity" values="1;0.5;1" keyTimes="0;0.5;1" dur="6s" begin="2.7s" repeatCount="indefinite"/>
    Deutsch
  </text>
  <text x="360.0" y="268.0" font-size="21" fill="#93A9B8" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">+ 75 more, and English is authored by hand</text>
