  <text x="360.0" y="358.0" font-size="26" fill="#5FD9AC" text-anchor="middle" font-weight="700" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">is proven here.</text>
  <text x="360.0" y="396.0" font-size="21" fill="#93A9B8" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">unproven stays unknown</text>
  <line x1="36" y1="594" x2="684" y2="594" stroke="#243340"/>
  <text x="36.0" y="628.0" font-size="21" fill="#9BBACB" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Atlas finds the path — and remembers it.</text>
  <text x="36.0" y="658.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Max AI decides when to act. Neither crosses into the other.</text>
