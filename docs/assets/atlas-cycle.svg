<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" role="img" aria-labelledby="at ac">
  <title id="at">Max Atlas — the loop that learns how this device works</title>
  <desc id="ac">Seven stages on a ring, clockwise from the top: Discover, Understand, Map, Adapt, Execute, Verify, Learn. The centre states the promise: what works on this device is proven here, not assumed. Nothing is claimed until it was read back.</desc>
