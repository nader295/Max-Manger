<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 732" width="720" height="732" role="img" aria-labelledby="dt dd">
  <title id="dt">What you can control — ten domains</title>
  <desc id="dd">Ten control domains, each with the app's own one-line description: CPU cores and governors, GPU frequencies and policies, memory ZRAM and swappiness, display refresh and colour, responsiveness touch and frames, thermal heat and throttling, power charge and bypass, storage and compiler health, network scheduling and link state, and audio output devices with the effects the engine declares. A control the device does not expose is not shown.</desc>
