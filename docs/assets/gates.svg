<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 594" width="720" height="594" role="img" aria-labelledby="gt gd">
  <title id="gt">16 checks before the compiler runs</title>
  <desc id="gd">A grid of the 16 checks that run in seconds, before any heavy build step, so a mistake is named early instead of after minutes of compiling.</desc>
  <defs>
    <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B242C"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="gt-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151F27"/>
      <stop offset="1" stop-color="#0E1418"/>
    </linearGradient>
  </defs>
  <rect x="0.0" y="0.0" width="720.0" height="594.0" rx="22" fill="url(#gt)" stroke="#243340" stroke-width="1.5"/>
  <rect x="34.0" y="6.0" width="652.0" height="1.4" rx="0.7" fill="#E8F1F7" opacity="0.10"/>
  <circle cx="614.0" cy="74.0" r="152.0" fill="#5FD9AC" opacity="0.04">
    <animate attributeName="opacity" values="0.04;0.09;0.04" keyTimes="0;0.5;1" dur="10.0s" repeatCount="indefinite"/>
  </circle>
